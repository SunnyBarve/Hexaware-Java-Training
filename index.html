<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>

    <!-- Latest compiled and minified CSS (Bootstrap 5) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header class="bg-dark text-white text-center py-4">
      <h1>Student Management System</h1>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
      <!-- Input form for adding students -->
      <div class="row">
        <div class="col-md-4 mb-3">
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter student name"
          />
        </div>
        <div class="col-md-4 mb-3">
          <input
            type="number"
            class="form-control"
            id="age"
            placeholder="Enter student age"
          />
        </div>
        <div class="col-md-4 mb-3">
          <input
            type="text"
            class="form-control"
            id="grade"
            placeholder="Enter student grade"
          />
        </div>
      </div>

      <!-- Buttons for actions -->
      <div class="d-grid gap-2 d-md-flex justify-content-md-center">
        <button class="btn btn-primary me-md-2" id="addButton">
          Add Student
        </button>
        <button class="btn btn-secondary me-md-2" id="viewButton">
          View Students
        </button>
        <button class="btn btn-warning me-md-2" id="sortButton">
          Sort by Age (Asc)
        </button>
        <button class="btn btn-danger" id="deleteButton">Delete Student</button>
      </div>

      <!-- Add Search Input Field for Searching Students -->
      <div class="row mt-4">
        <div class="col-md-8">
          <input
            type="text"
            class="form-control"
            id="search-name"
            placeholder="Enter student name to search"
          />
        </div>
        <div class="col-md-4">
          <button class="btn btn-info" type="button" onclick="searchStudent()">
            Search Student
          </button>
        </div>
      </div>

      <!-- Section to display student details -->
      <div id="student-list" class="mt-4"></div>
    </div>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
      <p>
        &copy; 2024 Student Management System | Powered by HTML, CSS,
        JavaScript, and Bootstrap 5
      </p>
    </footer>

    <!-- Latest compiled JavaScript (Bootstrap 5) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
